name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 10.33.2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build first: cross-package typecheck/tests resolve workspace deps via their
      # emitted dist/ (.d.ts + .js), so the declarations must exist before typecheck/test.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:docs
      - run: pnpm verify:integrations
      - run: pnpm verify:packages
      - run: pnpm verify:deploy
