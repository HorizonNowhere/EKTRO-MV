name: publish-mcp-registry

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated server record to the official MCP Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-0.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install verified MCP Registry publisher
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          chmod 0755 "$RUNNER_TEMP/mcp-publisher"

      - name: Validate Registry metadata
        run: |
          "$RUNNER_TEMP/mcp-publisher" validate mcp/ektro-mv-mcp/server.json

      - name: Verify the public npm artifact
        if: ${{ inputs.publish }}
        run: |
          test "$(npm view '@ektro-mv/mcp@0.2.0' version)" = "0.2.0"

      - name: Authenticate with GitHub OIDC
        if: ${{ inputs.publish }}
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      - name: Publish Registry record
        if: ${{ inputs.publish }}
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish mcp/ektro-mv-mcp/server.json
